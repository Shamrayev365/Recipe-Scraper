<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanRecipe - Distraction-Free Recipe Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .checkbox-custom:checked + label { text-decoration: line-through; opacity: 0.6; }
    .recipe-expand-content {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s ease-out;
    }
    .recipe-expand-content.open {
      grid-template-rows: 1fr;
    }
    .recipe-expand-inner {
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans pb-12">

  <!-- Header -->
  <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="showHome()">
        <i class="fa-solid fa-utensils text-2xl text-emerald-200"></i>
        <h1 class="text-2xl font-bold tracking-tight">CleanRecipe</h1>
      </div>
      
      <!-- Search Bar -->
      <form id="search-form" onsubmit="handleSearch(event)" class="w-full md:w-96 flex">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search all sites or paste URL..." 
          class="w-full px-4 py-2 rounded-l-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-300 text-sm"
          required
        />
        <button type="submit" class="bg-emerald-800 hover:bg-emerald-900 px-4 py-2 rounded-r-lg font-medium transition">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </form>

      <!-- Header Controls -->
      <div class="flex items-center space-x-4 w-full md:w-auto justify-between md:justify-end">
        <button onclick="toggleUnits()" id="global-unit-toggle" class="text-xs bg-emerald-700 hover:bg-emerald-800 text-white font-semibold px-3 py-1.5 rounded-lg transition border border-emerald-500">
          Units: Metric
        </button>
        <button onclick="showLibrary()" class="flex items-center gap-2 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-bold px-4 py-2 rounded-lg transition text-sm">
          <i class="fa-solid fa-book-bookmark"></i> My Library
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto px-4 mt-6">
    
    <!-- Saved Sites & Quick Launch Bar -->
    <section id="sites-manager" class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-globe text-emerald-600"></i> Saved Recipe Websites & Indexes
        </h2>
        <button onclick="toggleSitesModal(true)" class="text-xs bg-emerald-100 text-emerald-800 hover:bg-emerald-200 font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1">
          <i class="fa-solid fa-gear"></i> Manage & Index Sites
        </button>
      </div>
      <div id="saved-sites-pills" class="flex flex-wrap gap-2 text-xs"></div>
    </section>

    <!-- Loading & Error States -->
    <div id="loading" class="hidden text-center py-20">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-emerald-600 border-t-transparent mb-4"></div>
      <p class="text-slate-600 font-medium text-lg" id="loading-text">Fetching recipe data...</p>
    </div>
    <div id="error" class="hidden bg-red-50 border-l-4 border-red-500 p-4 rounded shadow-sm my-6">
      <div class="flex items-center">
        <i class="fa-solid fa-circle-exclamation text-red-500 text-xl mr-3"></i>
        <p class="text-red-700 font-medium" id="error-message"></p>
      </div>
    </div>

    <!-- Notification Banner -->
    <div id="notification" class="fixed bottom-4 right-4 bg-emerald-800 text-white px-6 py-3 rounded-lg shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 z-50">
      Notification
    </div>

    <!-- Results/Library Grid -->
    <section id="main-view">
      <h2 class="text-2xl font-bold mb-6 text-slate-700 hidden" id="view-title">Search Results</h2>
      <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 auto-rows-min"></div>
    </section>

  </main>

  <!-- Modal for Managing & Indexing Websites -->
  <div id="sites-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-sliders text-emerald-600 mr-2"></i>Manage & Index Websites</h3>
        <button onclick="toggleSitesModal(false)" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
      </div>
      
      <form onsubmit="addCustomSite(event)" class="mb-6 bg-slate-50 p-3 rounded-lg border border-slate-200 shrink-0">
        <p class="text-xs font-semibold text-slate-600 mb-2">Add New Website & Feed/Sitemap</p>
        <div class="space-y-2">
          <input type="text" id="new-site-name" placeholder="Website Name (e.g. Serious Eats)" class="w-full px-3 py-1.5 border rounded text-xs focus:ring-2 focus:ring-emerald-500 outline-none" required />
          <input type="url" id="new-site-url" placeholder="Main URL (https://www.seriouseats.com)" class="w-full px-3 py-1.5 border rounded text-xs focus:ring-2 focus:ring-emerald-500 outline-none" required />
          <input type="url" id="new-site-feed" placeholder="RSS or Recipe Index URL (optional)" class="w-full px-3 py-1.5 border rounded text-xs focus:ring-2 focus:ring-emerald-500 outline-none" />
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-1.5 rounded text-xs transition">Add Website</button>
        </div>
      </form>

      <h4 class="text-xs font-bold uppercase text-slate-500 tracking-wider mb-2">Saved Websites & Indexes</h4>
      <ul id="modal-sites-list" class="space-y-2 overflow-y-auto pr-1 flex-grow"></ul>
      
      <div class="mt-6 text-right shrink-0">
        <button onclick="toggleSitesModal(false)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold px-4 py-2 rounded-lg">Done</button>
      </div>
    </div>
  </div>

  <script>
    // --- Global State ---
    let isMetric = true;
    let myLibrary = JSON.parse(localStorage.getItem('clean_recipe_library')) || [];
    let currentRenderedCards = []; 

    // --- Saved Sites & Indexing Logic ---
    const DEFAULT_SITES = [
      { name: "BBC Good Food", url: "https://www.bbcgoodfood.com", feed: "https://www.bbcgoodfood.com/rss", recipes: [] },
      { name: "Serious Eats", url: "https://www.seriouseats.com", feed: "https://www.seriouseats.com/rss", recipes: [] },
      { name: "Allrecipes", url: "https://www.allrecipes.com", feed: "https://www.allrecipes.com/rss", recipes: [] }
    ];
    let savedSites = JSON.parse(localStorage.getItem('clean_recipe_saved_sites')) || DEFAULT_SITES;

    function saveSites() {
      localStorage.setItem('clean_recipe_saved_sites', JSON.stringify(savedSites));
      renderSitesPills();
      renderModalSitesList();
    }

    function renderSitesPills() {
      const container = document.getElementById('saved-sites-pills');
      container.innerHTML = '';
      savedSites.forEach(site => {
        const count = site.recipes ? site.recipes.length : 0;
        const btn = document.createElement('a');
        btn.href = site.url; btn.target = "_blank";
        btn.className = "bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 border border-slate-200 px-3 py-1 rounded-full transition flex items-center gap-1.5";
        btn.innerHTML = `<i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> ${site.name} <span class="bg-emerald-100 text-emerald-800 text-[9px] px-1.5 rounded-full font-bold">${count} indexed</span>`;
        container.appendChild(btn);
      });
    }

    function renderModalSitesList() {
      const list = document.getElementById('modal-sites-list');
      list.innerHTML = '';
      savedSites.forEach((site, index) => {
        const count = site.recipes ? site.recipes.length : 0;
        list.innerHTML += `
          <li class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-50 p-2.5 rounded text-xs border border-slate-200 gap-2">
            <div>
              <span class="font-bold text-slate-800">${site.name}</span>
              <span class="text-slate-400 block text-[10px]">${site.url}</span>
              <span class="text-emerald-600 font-medium text-[10px]">${count} recipes indexed</span>
            </div>
            <div class="flex items-center gap-1.5 w-full sm:w-auto justify-end">
              <button onclick="indexWebsite(${index})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded font-medium transition flex items-center gap-1">
                <i class="fa-solid fa-rotate"></i> Index
              </button>
              <button onclick="removeSite(${index})" class="bg-red-100 hover:bg-red-200 text-red-700 p-1.5 rounded transition"><i class="fa-solid fa-trash"></i></button>
            </div>
          </li>`;
      });
    }

    function addCustomSite(e) {
      e.preventDefault();
      const name = document.getElementById('new-site-name').value.trim();
      const url = document.getElementById('new-site-url').value.trim();
      const feed = document.getElementById('new-site-feed').value.trim();
      if (name && url) { 
        savedSites.push({ name, url, feed, recipes: [] }); 
        saveSites(); 
        e.target.reset(); 
      }
    }

    function removeSite(index) { savedSites.splice(index, 1); saveSites(); }
    function toggleSitesModal(show) { document.getElementById('sites-modal').classList.toggle('hidden', !show); }

    // --- Website Indexing Engine ---
    async function indexWebsite(index) {
      const site = savedSites[index];
      showNotification(`Indexing ${site.name}... Please wait.`);
      
      const targetUrl = site.feed || site.url;
      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error();
        const text = await res.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');
        
        let extractedRecipes = [];

        // Check if XML/RSS Feed
        const items = doc.querySelectorAll('item, entry');
        if (items.length > 0) {
          items.forEach(item => {
            const title = item.querySelector('title')?.textContent;
            const link = item.querySelector('link')?.textContent || item.querySelector('link')?.getAttribute('href');
            if (title && link) {
              extractedRecipes.push({ title: title.trim(), url: link.trim(), source: site.name });
            }
          });
        } else {
          // Fallback: Scrape regular recipe links from the HTML page
          doc.querySelectorAll('a').forEach(a => {
            const href = a.getAttribute('href');
            const title = a.textContent?.trim();
            if (href && title && title.length > 10 && (href.includes('recipe') || href.includes('food') || href.includes('dish'))) {
              const fullUrl = href.startsWith('http') ? href : new URL(href, site.url).href;
              if (!extractedRecipes.some(r => r.url === fullUrl)) {
                extractedRecipes.push({ title, url: fullUrl, source: site.name });
              }
            }
          });
        }

        site.recipes = extractedRecipes;
        saveSites();
        showNotification(`Successfully indexed ${extractedRecipes.length} recipes for ${site.name}!`);
      } catch (e) {
        showNotification(`Failed to index ${site.name}. Try adding a direct RSS feed URL.`);
      }
    }

    // --- Metric Conversion Engine ---
    const FRACTIONS = { '½': 0.5, '⅓': 0.333, '⅔': 0.666, '¼': 0.25, '¾': 0.75, '⅛': 0.125, '⅜': 0.375, '⅝': 0.625, '⅞': 0.875 };
    function parseFraction(str) {
      let total = 0;
      str.trim().split(' ').forEach(p => {
        if (FRACTIONS[p]) total += FRACTIONS[p];
        else if (p.includes('/')) { const [n, d] = p.split('/'); total += parseFloat(n)/parseFloat(d); }
        else if (!isNaN(parseFloat(p))) total += parseFloat(p);
      });
      return total || null;
    }

    function convertIngredientToMetric(text) {
      if (!isMetric || !text) return text;
      text = text.replace(/(\d+)\s*(?:°|degrees)?\s*F\b/gi, (m, f) => `${Math.round((parseInt(f) - 32) * (5/9))}°C`);
      const unitRegex = /([\d\s\/½⅓⅔¼¾⅛⅜⅝⅞\.-]+)\s*(cups?|c\.|oz|ounces?|lbs?|pounds?|tbsp|tablespoons?|tsp|teaspoons?)\b/gi;
      return text.replace(unitRegex, (match, amt, unit) => {
        const val = parseFraction(amt);
        if (!val) return match;
        unit = unit.toLowerCase();
        if (unit.startsWith('cup') || unit === 'c.') return `${Math.round(val * 240)} ml`;
        if (unit.startsWith('tbsp')) return `${Math.round(val * 15)} ml`;
        if (unit.startsWith('tsp')) return `${Math.round(val * 5)} ml`;
        if (unit.startsWith('lb') || unit.startsWith('pound')) return `${Math.round(val * 453.6)} g`;
        if (unit.startsWith('oz') || unit.startsWith('ounce')) return `${Math.round(val * 28.35)} g`;
        return match;
      });
    }

    function toggleUnits() {
      isMetric = !isMetric;
      document.getElementById('global-unit-toggle').innerText = isMetric ? "Units: Metric" : "Units: Original";
      currentRenderedCards.forEach((res, index) => {
        const expandedContent = document.getElementById(`expand-content-${index}`);
        if (expandedContent && expandedContent.classList.contains('open')) {
            renderIngredientsList(index, res.ingredients);
            renderInstructionsList(index, res.instructions);
        }
      });
    }

    // --- Search & Fetch Logic ---
    function showLoading(msg) {
      document.getElementById('loading-text').innerText = msg;
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('error').classList.add('hidden');
      document.getElementById('results-grid').innerHTML = '';
      document.getElementById('view-title').classList.add('hidden');
    }
    
    function showError(msg) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error-message').innerText = msg;
      document.getElementById('error').classList.remove('hidden');
    }
    
    function showHome() {
      document.getElementById('sites-manager').classList.remove('hidden');
      document.getElementById('results-grid').innerHTML = '';
      document.getElementById('view-title').classList.add('hidden');
      document.getElementById('search-input').value = '';
    }

    function showNotification(msg) {
        const notif = document.getElementById('notification');
        notif.innerText = msg;
        notif.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => notif.classList.add('translate-y-20', 'opacity-0'), 4000);
    }

    async function handleSearch(e) {
      e.preventDefault();
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      if (!query) return;

      document.getElementById('sites-manager').classList.remove('hidden');
      
      if (query.startsWith('http')) {
        showLoading("Scraping direct URL...");
        const result = await fetchRecipeFromUrl(query);
        if (result) {
          document.getElementById('loading').classList.add('hidden');
          renderResultsGrid([result], "Direct URL Scrape", false);
        }
        return;
      }

      showLoading(`Searching recipes for "${query}" across all sources...`);
      let results = [];

      // 1. Search across user's indexed saved sites
      savedSites.forEach(site => {
        if (site.recipes) {
          site.recipes.forEach(rec => {
            if (rec.title.toLowerCase().includes(query)) {
              results.push({
                id: btoa(rec.url).substring(0, 10),
                title: rec.title,
                source: site.name,
                url: rec.url,
                image: "https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&w=800&q=80",
                yield: "N/A", time: "N/A",
                ingredients: ["Click 'Open' to load ingredients from URL."],
                instructions: ["Click 'Open' to load instructions from URL."]
              });
            }
          });
        }
      });

      // 2. Search TheMealDB API
      try {
        const apiRes = await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(query)}`);
        const apiData = await apiRes.json();
        if (apiData.meals) {
          apiData.meals.forEach(meal => {
            const ingredients = [];
            for (let i=1; i<=20; i++) {
              if (meal[`strIngredient${i}`]?.trim()) ingredients.push(`${meal[`strMeasure${i}`]?.trim() || ''} ${meal[`strIngredient${i}`].trim()}`);
            }
            results.push({
              id: meal.idMeal,
              title: meal.strMeal,
              source: meal.strArea ? `${meal.strArea} Recipe` : "TheMealDB",
              url: meal.strSource || `https://www.themealdb.com/meal/${meal.idMeal}`,
              image: meal.strMealThumb,
              yield: "4 servings", time: "30-45 mins",
              ingredients,
              instructions: meal.strInstructions ? meal.strInstructions.split('\r\n').filter(s=>s.trim()) : [],
            });
          });
        }
      } catch(e) {}

      document.getElementById('loading').classList.add('hidden');
      if (results.length > 0) renderResultsGrid(results, `Results for "${query}"`, false);
      else showError(`No recipes found matching "${query}". Try indexing more sites or pasting a direct URL.`);
    }

    async function fetchRecipeFromUrl(url) {
      try {
        const proxies = [`https://corsproxy.io/?${encodeURIComponent(url)}`, `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`];
        let html;
        for (const p of proxies) { try { const res = await fetch(p); if (res.ok) { html = await res.text(); break; } } catch(e){} }
        if (!html) throw new Error();

        const doc = new DOMParser().parseFromString(html, 'text/html');
        let recipeData = null;
        doc.querySelectorAll('script[type="application/ld+json"]').forEach(script => {
          try {
            const data = JSON.parse(script.innerText);
            const items = Array.isArray(data) ? data : (data['@graph'] || [data]);
            recipeData = recipeData || items.find(i => i['@type'] === 'Recipe' || (Array.isArray(i['@type']) && i['@type'].includes('Recipe')));
          } catch(e){}
        });

        if (!recipeData) { 
          // Fallback if no JSON-LD schema
          return {
            id: btoa(url).substring(0, 10),
            title: doc.querySelector('h1')?.innerText || "Untitled Recipe",
            url: url,
            image: doc.querySelector('img']?.src || "https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&w=800&q=80",
            source: new URL(url).hostname.replace('www.', ''),
            yield: "N/A", time: "N/A",
            ingredients: ["Could not automatically parse structured ingredients. Visit original site."],
            instructions: ["Visit original site for instructions."]
          };
        }

        let instructions = [];
        if (recipeData.recipeInstructions) {
          const raw = recipeData.recipeInstructions;
          if (typeof raw === 'string') instructions = [raw];
          else raw.forEach(step => {
            if (typeof step === 'string') instructions.push(step);
            else if (step['@type'] === 'HowToStep') instructions.push(step.text);
            else if (step['@type'] === 'HowToSection' && step.itemListElement) step.itemListElement.forEach(s => instructions.push(s.text || s));
          });
        }

        let img = "https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&w=800&q=80";
        if (recipeData.image) {
          if (typeof recipeData.image === 'string') img = recipeData.image;
          else if (Array.isArray(recipeData.image)) img = recipeData.image[0].url || recipeData.image[0];
          else if (recipeData.image.url) img = recipeData.image.url;
        }

        return {
          id: btoa(url).substring(0, 10),
          title: recipeData.name || "Untitled",
          url: url,
          image: img,
          source: new URL(url).hostname.replace('www.', ''),
          yield: recipeData.recipeYield ? (Array.isArray(recipeData.recipeYield) ? recipeData.recipeYield[0] : recipeData.recipeYield) : "N/A",
          time: recipeData.totalTime ? recipeData.totalTime.replace('PT','').toLowerCase() : "N/A",
          ingredients: recipeData.recipeIngredient || [],
          instructions: instructions
        };
      } catch (e) {
        showError("Failed to fetch page. Ensure the URL is correct and public.");
        return null;
      }
    }

    // --- Render Grid & Expand Logic ---
    function renderResultsGrid(results, titleStr, isLibraryView) {
      currentRenderedCards = results;
      const title = document.getElementById('view-title');
      title.innerText = titleStr;
      title.classList.remove('hidden');
      
      const grid = document.getElementById('results-grid');
      grid.innerHTML = '';

      if (results.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-slate-500 text-center py-10">No recipes found here.</p>';
        return;
      }

      results.forEach((res, index) => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden transition-all duration-300 flex flex-col";
        card.id = `recipe-card-${index}`;

        const isSaved = myLibrary.some(r => r.id === res.id);
        const actionButtonHtml = isLibraryView 
            ? `<button onclick="removeFromLibrary('${res.id}')" class="shrink-0 bg-red-100 hover:bg-red-200 text-red-700 text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2 transition"><i class="fa-solid fa-trash"></i> Remove</button>`
            : `<button onclick="saveToLibrary(${index})" class="shrink-0 ${isSaved ? 'bg-slate-200 text-slate-500' : 'bg-slate-800 hover:bg-black text-white'} text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2 transition" ${isSaved ? 'disabled' : ''}><i class="fa-solid fa-bookmark"></i> ${isSaved ? 'Saved' : 'Save'}</button>`;

        card.innerHTML = `
          <div class="cursor-pointer group flex flex-col" onclick="onCardClick(${index})">
            <div class="h-44 w-full bg-slate-100 overflow-hidden relative">
              <img src="${res.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${res.title}">
              <div class="absolute inset-0 bg-black/10 group-hover:bg-transparent transition duration-300"></div>
            </div>
            <div class="p-4 flex-grow flex flex-col justify-between">
              <div>
                <span class="text-[10px] font-bold text-emerald-600 uppercase tracking-wider">${res.source}</span>
                <h3 class="text-base font-bold text-slate-800 mt-1 mb-2 leading-tight line-clamp-2">${res.title}</h3>
              </div>
              <div class="text-xs text-slate-500 flex items-center justify-between mt-2">
                <span><i class="fa-solid fa-clock"></i> ${res.time}</span>
                <span id="expand-icon-${index}" class="text-emerald-600 bg-emerald-50 px-2 py-1 rounded transition"><i class="fa-solid fa-chevron-down"></i> Open</span>
              </div>
            </div>
          </div>
          
          <div id="expand-content-${index}" class="recipe-expand-content border-t border-slate-100 bg-slate-50">
            <div class="recipe-expand-inner">
              <div class="p-4 md:p-6">
                <div class="flex flex-col sm:flex-row justify-between items-start gap-4 mb-6 pb-4 border-b border-slate-200">
                  <div>
                    <h2 class="text-xl md:text-2xl font-extrabold text-slate-800">${res.title}</h2>
                    <p class="text-xs md:text-sm text-slate-600 mt-1">
                      Source: <a href="${res.url}" target="_blank" class="text-emerald-600 underline font-semibold">${res.source}</a> 
                      | Yields: <span id="res-yield-${index}">${res.yield}</span>
                    </p>
                  </div>
                  ${actionButtonHtml}
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div class="md:col-span-1 bg-white p-4 rounded-lg border border-slate-200 shadow-sm h-fit">
                    <h3 class="font-bold text-slate-800 mb-3 border-b pb-2 text-sm"><i class="fa-solid fa-basket-shopping text-emerald-600 mr-2"></i>Ingredients</h3>
                    <ul id="ing-list-${index}" class="space-y-2"></ul>
                  </div>
                  <div class="md:col-span-2">
                    <h3 class="font-bold text-slate-800 mb-3 border-b pb-2 text-sm"><i class="fa-solid fa-list-check text-emerald-600 mr-2"></i>Instructions</h3>
                    <ol id="inst-list-${index}" class="space-y-3"></ol>
                  </div>
                </div>
                
                <div class="mt-6 text-center">
                  <button onclick="toggleRecipeExpand(${index})" class="text-sm text-slate-500 hover:text-slate-800 font-semibold px-4 py-2 bg-slate-200 rounded-lg transition">Close Recipe</button>
                </div>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function onCardClick(index) {
      const res = currentRenderedCards[index];
      // If it's an indexed search result that hasn't been scraped yet, fetch it on the fly!
      if (res.ingredients.length === 1 && res.ingredients[0].includes("Click 'Open'")) {
        showNotification("Fetching full recipe details...");
        const fullData = await fetchRecipeFromUrl(res.url);
        if (fullData) {
          currentRenderedCards[index] = { ...res, ...fullData };
        }
      }
      toggleRecipeExpand(index);
    }

    function toggleRecipeExpand(index) {
      const content = document.getElementById(`expand-content-${index}`);
      const icon = document.getElementById(`expand-icon-${index}`);
      const card = document.getElementById(`recipe-card-${index}`);
      const res = currentRenderedCards[index];

      if (content.classList.contains('open')) {
        content.classList.remove('open');
        card.classList.remove('md:col-span-2', 'lg:col-span-3');
        icon.innerHTML = '<i class="fa-solid fa-chevron-down"></i> Open';
      } else {
        content.classList.add('open');
        card.classList.add('md:col-span-2', 'lg:col-span-3');
        icon.innerHTML = '<i class="fa-solid fa-chevron-up"></i> Close';
        
        document.getElementById(`res-yield-${index}`).innerText = res.yield;
        renderIngredientsList(index, res.ingredients);
        renderInstructionsList(index, res.instructions);
        
        setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
      }
    }

    function renderIngredientsList(index, ingredients) {
      const ul = document.getElementById(`ing-list-${index}`);
      ul.innerHTML = '';
      ingredients.forEach(ing => {
        const li = document.createElement('li');
        li.className = "text-slate-700 text-xs flex items-start space-x-2";
        li.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500 mt-0.5 text-[10px]"></i> <span>${convertIngredientToMetric(ing)}</span>`;
        ul.appendChild(li);
      });
    }

    function renderInstructionsList(index, instructions) {
      const ol = document.getElementById(`inst-list-${index}`);
      ol.innerHTML = '';
      instructions.forEach((step, idx) => {
        const li = document.createElement('li');
        li.className = "flex items-start space-x-3";
        li.innerHTML = `
          <input type="checkbox" id="step-${index}-${idx}" class="checkbox-custom mt-1 h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500 shrink-0">
          <label for="step-${index}-${idx}" class="text-slate-700 text-sm leading-relaxed cursor-pointer select-none">${convertIngredientToMetric(step)}</label>
        `;
        ol.appendChild(li);
      });
    }

    // --- Library Management ---
    function saveToLibrary(index) {
        const recipe = currentRenderedCards[index];
        if (!myLibrary.some(r => r.id === recipe.id)) {
            myLibrary.push(recipe);
            localStorage.setItem('clean_recipe_library', JSON.stringify(myLibrary));
            
            const card = document.getElementById(`recipe-card-${index}`);
            const btn = card.querySelector('button[onclick^="saveToLibrary"]');
            btn.className = "shrink-0 bg-slate-200 text-slate-500 text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2 transition";
            btn.innerHTML = '<i class="fa-solid fa-bookmark"></i> Saved';
            btn.disabled = true;

            showNotification("Recipe saved to your Library!");
        }
    }

    function removeFromLibrary(id) {
        myLibrary = myLibrary.filter(r => r.id !== id);
        localStorage.setItem('clean_recipe_library', JSON.stringify(myLibrary));
        showNotification("Recipe removed.");
        showLibrary();
    }

    function showLibrary() {
        document.getElementById('sites-manager').classList.add('hidden');
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('error').classList.add('hidden');
        document.getElementById('search-input').value = '';
        renderResultsGrid(myLibrary, "My Recipe Library", true);
    }

    // Initialize
    renderSitesPills();
    renderModalSitesList();
  </script>
</body>
</html>
