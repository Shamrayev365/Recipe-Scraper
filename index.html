<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanRecipe - Distraction-Free Recipe Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- Navigation -->
  <header class="bg-emerald-700 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
        <h1 class="text-2xl font-bold tracking-tight">CleanRecipe</h1>
      </div>

      <!-- Search Bar -->
      <div class="w-full sm:w-96 flex">
        <input type="text" id="searchInput" placeholder="Search saved recipes..." class="w-full px-4 py-2 text-slate-900 rounded-l-lg focus:outline-none" onkeyup="filterRecipes()">
        <button class="bg-emerald-900 px-4 py-2 rounded-r-lg font-semibold hover:bg-emerald-950 transition">Search</button>
      </div>

      <button onclick="toggleModal(true)" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Manage Sites
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Recipes rendered dynamically -->
    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-4 right-4 bg-emerald-800 text-white px-6 py-3 rounded-lg shadow-lg hidden transition-opacity duration-300"></div>

  <!-- Manage Sites Modal -->
  <div id="siteModal" class="fixed inset-0 bg-slate-900/50 hidden backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 relative">
      <button onclick="toggleModal(false)" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">✕</button>
      <h2 class="text-xl font-bold text-slate-900 mb-4">Manage Saved Sites & Feeds</h2>

      <!-- Add Site Form -->
      <form onsubmit="handleAddSite(event)" class="space-y-3 mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200">
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Site Name</label>
          <input type="text" id="siteName" required placeholder="BBC Good Food" class="w-full px-3 py-2 border rounded-md text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Main Website URL</label>
          <input type="url" id="siteMainUrl" required placeholder="https://www.bbcgoodfood.com" class="w-full px-3 py-2 border rounded-md text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">RSS/Atom Feed URL</label>
          <input type="url" id="siteFeedUrl" required placeholder="https://www.bbcgoodfood.com/feed/atom" class="w-full px-3 py-2 border rounded-md text-sm">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-md font-medium text-sm transition">Add Website</button>
      </form>

      <!-- Saved Sites List -->
      <div id="siteList" class="space-y-3 max-h-60 overflow-y-auto">
        <!-- Site items rendered dynamically -->
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_SITES = [
      { id: 'bbc', name: 'BBC Good Food', mainUrl: 'https://www.bbcgoodfood.com', feedUrl: 'https://www.bbcgoodfood.com/feed/atom' },
      { id: 'serious-eats', name: 'Serious Eats', mainUrl: 'https://www.seriouseats.com', feedUrl: 'https://www.seriouseats.com/rss' },
      { id: 'allrecipes', name: 'Allrecipes', mainUrl: 'https://www.allrecipes.com', feedUrl: 'https://www.allrecipes.com/feed/atom' },
      { id: 'conn-veg', name: 'Connoisseurus Veg', mainUrl: 'https://www.connoisseurusveg.com', feedUrl: 'https://www.connoisseurusveg.com/feed' }
    ];

    let sites = JSON.parse(localStorage.getItem('clean_sites')) || DEFAULT_SITES;
    let recipes = JSON.parse(localStorage.getItem('clean_recipes')) || [];

    function saveSites() {
      localStorage.setItem('clean_sites', JSON.stringify(sites));
    }

    function toggleModal(show) {
      document.getElementById('siteModal').classList.toggle('hidden', !show);
      if (show) renderSiteList();
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-lg transition-opacity duration-300 ${type === 'error' ? 'bg-red-700' : 'bg-emerald-800'} text-white`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4000);
    }

    function handleAddSite(e) {
      e.preventDefault();
      const name = document.getElementById('siteName').value.trim();
      const mainUrl = document.getElementById('siteMainUrl').value.trim();
      const feedUrl = document.getElementById('siteFeedUrl').value.trim();

      const newSite = { id: Date.now().toString(), name, mainUrl, feedUrl };
      sites.push(newSite);
      saveSites();
      renderSiteList();
      e.target.reset();
      showToast(`Added ${name}`);
    }

    function deleteSite(id) {
      sites = sites.filter(s => s.id !== id);
      recipes = recipes.filter(r => r.siteId !== id);
      saveSites();
      localStorage.setItem('clean_recipes', JSON.stringify(recipes));
      renderSiteList();
      renderRecipes();
    }

    async function indexSite(siteId) {
      const site = sites.find(s => s.id === siteId);
      if (!site) return;

      showToast(`Indexing ${site.name}...`);

      try {
        const res = await fetch(`/?url=${encodeURIComponent(site.feedUrl)}`);
        if (!res.ok) throw new Error(`Server returned HTTP ${res.status}`);

        const xmlText = await res.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'application/xml');

        if (xmlDoc.querySelector('parsererror')) {
          throw new Error('Could not parse feed XML format.');
        }

        // Support both RSS (<item>) and Atom (<entry>) nodes
        const nodes = xmlDoc.querySelectorAll('item, entry');
        let parsedRecipes = [];

        nodes.forEach(node => {
          const title = node.querySelector('title')?.textContent?.trim() || '';

          // Extract link: handles RSS (<link>url</link>) and Atom (<link href="url" />)
          let link = '';
          const linkEl = node.querySelector('link');
          if (linkEl) {
            link = linkEl.getAttribute('href') || linkEl.textContent?.trim() || '';
          }

          if (title && link) {
            parsedRecipes.push({
              id: btoa(link).substring(0, 20),
              siteId: site.id,
              siteName: site.name,
              title: title,
              link: link,
              date: new Date().toLocaleDateString()
            });
          }
        });

        // Merge recipes into local storage uniquely by link ID
        const otherRecipes = recipes.filter(r => r.siteId !== site.id);
        recipes = [...otherRecipes, ...parsedRecipes];
        localStorage.setItem('clean_recipes', JSON.stringify(recipes));

        renderSiteList();
        renderRecipes();
        showToast(`Successfully indexed ${parsedRecipes.length} recipes for ${site.name}!`);

      } catch (err) {
        console.error('Indexing failed:', err);
        showToast(`Failed to index ${site.name}: ${err.message}`, 'error');
      }
    }

    function renderSiteList() {
      const listEl = document.getElementById('siteList');
      listEl.innerHTML = sites.map(site => {
        const count = recipes.filter(r => r.siteId === site.id).length;
        return `
          <div class="flex items-center justify-between p-3 bg-slate-100 rounded-lg border border-slate-200">
            <div>
              <h4 class="font-semibold text-slate-900 text-sm">${site.name}</h4>
              <p class="text-xs text-slate-500">${count} recipes indexed</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="indexSite('${site.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded text-xs font-medium transition">Index</button>
              <button onclick="deleteSite('${site.id}')" class="text-red-600 hover:text-red-800 p-1 text-xs">Delete</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderRecipes(items = recipes) {
      const grid = document.getElementById('recipeGrid');
      if (items.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 text-slate-500">
            No recipes indexed yet. Open <strong>Manage Sites</strong> and click <strong>Index</strong> to pull recipes from your feeds.
          </div>
        `;
        return;
      }

      grid.innerHTML = items.map(recipe => `
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
          <div>
            <span class="text-xs font-semibold uppercase tracking-wider text-emerald-600 bg-emerald-50 px-2 py-1 rounded">${recipe.siteName}</span>
            <h3 class="font-bold text-slate-900 mt-2 text-lg line-clamp-2">${recipe.title}</h3>
          </div>
          <a href="${recipe.link}" target="_blank" rel="noopener noreferrer" class="mt-4 inline-flex items-center justify-center gap-1 bg-slate-900 hover:bg-slate-800 text-white text-sm py-2 px-4 rounded-lg font-medium transition">
            View Recipe
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          </a>
        </div>
      `).join('');
    }

    function filterRecipes() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = recipes.filter(r => r.title.toLowerCase().includes(query) || r.siteName.toLowerCase().includes(query));
      renderRecipes(filtered);
    }

    // Initial load
    renderRecipes();
  </script>
</body>
</html>
