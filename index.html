<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanRecipe - Distraction-Free Recipe Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .checkbox-custom:checked + label { text-decoration: line-through; opacity: 0.6; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans pb-12">

  <!-- Header -->
  <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="showSearch()">
        <i class="fa-solid fa-utensils text-2xl text-emerald-200"></i>
        <h1 class="text-2xl font-bold tracking-tight">CleanRecipe</h1>
      </div>
      
      <!-- Search Bar -->
      <form id="search-form" onsubmit="handleSearch(event)" class="w-full sm:w-96 flex">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search recipes or paste direct URL..." 
          class="w-full px-4 py-2 rounded-l-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-300 text-sm"
          required
        />
        <button type="submit" class="bg-emerald-800 hover:bg-emerald-900 px-5 py-2 rounded-r-lg font-medium transition">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </form>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto px-4 mt-6">
    
    <!-- Saved Sites & Quick Launch Bar -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider flex items-center gap-2">
          <i class="fa-solid fa-globe text-emerald-600"></i> Saved Recipe Websites
        </h2>
        <button onclick="toggleSitesModal(true)" class="text-xs bg-emerald-100 text-emerald-800 hover:bg-emerald-200 font-semibold px-3 py-1.5 rounded-lg transition flex items-center gap-1">
          <i class="fa-solid fa-gear"></i> Manage Sites
        </button>
      </div>
      <div id="saved-sites-pills" class="flex flex-wrap gap-2 text-xs">
        <!-- Dynamically rendered site buttons -->
      </div>
    </section>

    <!-- Loading State -->
    <div id="loading" class="hidden text-center py-20">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-emerald-600 border-t-transparent mb-4"></div>
      <p class="text-slate-600 font-medium text-lg" id="loading-text">Fetching recipe data...</p>
    </div>

    <!-- Error State -->
    <div id="error" class="hidden bg-red-50 border-l-4 border-red-500 p-4 rounded shadow-sm my-6">
      <div class="flex items-center">
        <i class="fa-solid fa-circle-exclamation text-red-500 text-xl mr-3"></i>
        <p class="text-red-700 font-medium" id="error-message">Could not load recipe.</p>
      </div>
    </div>

    <!-- Results Grid -->
    <section id="results-view" class="hidden">
      <h2 class="text-2xl font-bold mb-6 text-slate-700" id="results-title">Search Results</h2>
      <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

    <!-- Detailed Recipe View -->
    <article id="recipe-view" class="hidden bg-white rounded-xl shadow-lg border border-slate-100 overflow-hidden">
      <!-- Recipe Header -->
      <div class="relative h-72 sm:h-96 w-full bg-slate-200">
        <img id="recipe-img" class="w-full h-full object-cover" src="" alt="Recipe Image">
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/30 to-transparent flex items-end">
          <div class="p-6 text-white w-full">
            <span id="recipe-source" class="bg-emerald-600 text-xs px-2.5 py-1 rounded-full uppercase tracking-wider font-semibold"></span>
            <h1 id="recipe-title" class="text-3xl sm:text-4xl font-extrabold mt-2 mb-2 leading-tight"></h1>
            <div class="flex flex-wrap items-center gap-4 text-sm text-slate-200 mt-2">
              <span id="recipe-yield"><i class="fa-solid fa-users mr-1"></i> <span>-</span></span>
              <span id="recipe-time"><i class="fa-solid fa-clock mr-1"></i> <span>-</span></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Recipe Content -->
      <div class="p-6 sm:p-10 grid grid-cols-1 md:grid-cols-3 gap-10">
        <!-- Ingredients Column -->
        <div class="md:col-span-1 bg-slate-50 p-6 rounded-xl border border-slate-200 h-fit">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-basket-shopping mr-2 text-emerald-600"></i>Ingredients</h3>
            <button onclick="toggleUnits()" id="unit-toggle" class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded hover:bg-emerald-200">
              Units: Metric
            </button>
          </div>
          <ul id="ingredients-list" class="space-y-3"></ul>
        </div>

        <!-- Instructions Column -->
        <div class="md:col-span-2">
          <h3 class="text-2xl font-bold text-slate-800 mb-6"><i class="fa-solid fa-list-check mr-2 text-emerald-600"></i>Instructions</h3>
          <ol id="instructions-list" class="space-y-6"></ol>
        </div>
      </div>
    </article>

  </main>

  <!-- Modal for Managing Websites -->
  <div id="sites-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800"><i class="fa-solid fa-sliders text-emerald-600 mr-2"></i>Manage Saved Recipe Websites</h3>
        <button onclick="toggleSitesModal(false)" class="text-slate-400 hover:text-slate-600 text-xl">&times;</button>
      </div>
      
      <!-- Add Site Form -->
      <form onsubmit="addCustomSite(event)" class="mb-6 bg-slate-50 p-3 rounded-lg border border-slate-200">
        <p class="text-xs font-semibold text-slate-600 mb-2">Add New Website</p>
        <div class="space-y-2">
          <input type="text" id="new-site-name" placeholder="Website Name (e.g. BBC Good Food)" class="w-full px-3 py-1.5 border rounded text-xs focus:ring-2 focus:ring-emerald-500 outline-none" required />
          <input type="url" id="new-site-url" placeholder="URL (e.g. https://www.bbcgoodfood.com)" class="w-full px-3 py-1.5 border rounded text-xs focus:ring-2 focus:ring-emerald-500 outline-none" required />
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-1.5 rounded text-xs transition">Add Website</button>
        </div>
      </form>

      <!-- Current Saved Sites List -->
      <h4 class="text-xs font-bold uppercase text-slate-500 tracking-wider mb-2">Saved Websites</h4>
      <ul id="modal-sites-list" class="space-y-2 max-h-48 overflow-y-auto pr-1"></ul>

      <div class="mt-6 text-right">
        <button onclick="toggleSitesModal(false)" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold px-4 py-2 rounded-lg">Done</button>
      </div>
    </div>
  </div>

  <script>
    let isMetric = true;
    let currentRecipeData = null;

    // Default target websites
    const DEFAULT_SITES = [
      { name: "BBC Good Food", url: "https://www.bbcgoodfood.com" },
      { name: "Serious Eats", url: "https://www.seriouseats.com" },
      { name: "Allrecipes", url: "https://www.allrecipes.com" },
      { name: "Simply Recipes", url: "https://www.simplyrecipes.com" },
      { name: "Jamie Oliver", url: "https://www.jamieoliver.com" },
      { name: "Food Network", url: "https://www.foodnetwork.com" }
    ];

    let savedSites = JSON.parse(localStorage.getItem('clean_recipe_saved_sites')) || DEFAULT_SITES;

    function saveSites() {
      localStorage.setItem('clean_recipe_saved_sites', JSON.stringify(savedSites));
      renderSitesPills();
      renderModalSitesList();
    }

    function renderSitesPills() {
      const container = document.getElementById('saved-sites-pills');
      container.innerHTML = '';
      savedSites.forEach(site => {
        const btn = document.createElement('a');
        btn.href = site.url;
        btn.target = "_blank";
        btn.className = "bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-700 border border-slate-200 px-3 py-1 rounded-full transition flex items-center gap-1.5";
        btn.innerHTML = `<i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> ${site.name}`;
        container.appendChild(btn);
      });
    }

    function renderModalSitesList() {
      const list = document.getElementById('modal-sites-list');
      list.innerHTML = '';
      savedSites.forEach((site, index) => {
        const li = document.createElement('li');
        li.className = "flex justify-between items-center bg-slate-50 p-2 rounded text-xs border border-slate-200";
        li.innerHTML = `
          <div>
            <span class="font-bold text-slate-800">${site.name}</span>
            <span class="text-slate-400 block text-[10px]">${site.url}</span>
          </div>
          <button onclick="removeSite(${index})" class="text-red-500 hover:text-red-700 p-1"><i class="fa-solid fa-trash"></i></button>
        `;
        list.appendChild(li);
      });
    }

    function addCustomSite(e) {
      e.preventDefault();
      const name = document.getElementById('new-site-name').value.trim();
      const url = document.getElementById('new-site-url').value.trim();
      if (name && url) {
        savedSites.push({ name, url });
        saveSites();
        document.getElementById('new-site-name').value = '';
        document.getElementById('new-site-url').value = '';
      }
    }

    function removeSite(index) {
      savedSites.splice(index, 1);
      saveSites();
    }

    function toggleSitesModal(show) {
      document.getElementById('sites-modal').classList.toggle('hidden', !show);
    }

    // Units Conversion Engine
    const FRACTIONS = { '½': 0.5, '⅓': 0.333, '⅔': 0.666, '¼': 0.25, '¾': 0.75, '⅛': 0.125, '⅜': 0.375, '⅝': 0.625, '⅞': 0.875 };

    function parseFraction(str) {
      let total = 0;
      const parts = str.trim().split(' ');
      parts.forEach(p => {
        if (FRACTIONS[p]) {
          total += FRACTIONS[p];
        } else if (p.includes('/')) {
          const [num, den] = p.split('/');
          total += parseFloat(num) / parseFloat(den);
        } else if (!isNaN(parseFloat(p))) {
          total += parseFloat(p);
        }
      });
      return total || null;
    }

    function convertIngredientToMetric(text) {
      if (!isMetric || !text) return text;

      // Convert Fahrenheit temps
      text = text.replace(/(\d+)\s*(?:°|degrees)?\s*F\b/gi, (match, f) => {
        const c = Math.round((parseInt(f) - 32) * (5 / 9));
        return `${c}°C`;
      });

      const unitRegex = /([\d\s\/½⅓⅔¼¾⅛⅜⅝⅞\.-]+)\s*(cups?|c\.|oz|ounces?|lbs?|pounds?|tbsp|tablespoons?|tsp|teaspoons?)\b/gi;

      return text.replace(unitRegex, (match, amountStr, unit) => {
        const val = parseFraction(amountStr);
        if (!val) return match;

        unit = unit.toLowerCase();
        if (unit.startsWith('cup') || unit === 'c.') {
          return `${Math.round(val * 240)} ml`;
        } else if (unit.startsWith('tbsp') || unit.startsWith('tablespoon')) {
          return `${Math.round(val * 15)} ml`;
        } else if (unit.startsWith('tsp') || unit.startsWith('teaspoon')) {
          return `${Math.round(val * 5)} ml`;
        } else if (unit.startsWith('lb') || unit.startsWith('pound')) {
          return `${Math.round(val * 453.6)} g`;
        } else if (unit.startsWith('oz') || unit.startsWith('ounce')) {
          return `${Math.round(val * 28.35)} g`;
        }

        return match;
      });
    }

    function toggleUnits() {
      isMetric = !isMetric;
      document.getElementById('unit-toggle').innerText = isMetric ? "Units: Metric" : "Units: Original";
      if (currentRecipeData) renderIngredients(currentRecipeData.ingredients);
    }

    function showLoading(msg) {
      document.getElementById('loading-text').innerText = msg;
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('error').classList.add('hidden');
      document.getElementById('results-view').classList.add('hidden');
      document.getElementById('recipe-view').classList.add('hidden');
    }

    function showError(msg) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error-message').innerText = msg;
      document.getElementById('error').classList.remove('hidden');
    }

    function showSearch() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.add('hidden');
      document.getElementById('recipe-view').classList.add('hidden');
      if (document.getElementById('results-grid').children.length > 0) {
        document.getElementById('results-view').classList.remove('hidden');
      }
    }

    async function handleSearch(e) {
      e.preventDefault();
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      if (query.startsWith('http://') || query.startsWith('https://')) {
        fetchAndRenderRecipe(query);
      } else {
        searchRecipes(query);
      }
    }

    // Search via TheMealDB API + Fallback Web Search
    async function searchRecipes(query) {
      showLoading(`Searching recipes for "${query}"...`);
      let results = [];

      try {
        // 1. Query TheMealDB Open API for instant high-quality recipes
        const apiRes = await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(query)}`);
        const apiData = await apiRes.json();

        if (apiData.meals) {
          apiData.meals.forEach(meal => {
            // Convert TheMealDB structure to uniform format
            const ingredients = [];
            for (let i = 1; i <= 20; i++) {
              const ing = meal[`strIngredient${i}`];
              const measure = meal[`strMeasure${i}`];
              if (ing && ing.trim()) {
                ingredients.push(`${measure ? measure.trim() : ''} ${ing.trim()}`);
              }
            }

            const steps = meal.strInstructions ? meal.strInstructions.split('\r\n').filter(s => s.trim()) : [];

            results.push({
              title: meal.strMeal,
              source: meal.strArea ? `${meal.strArea} Recipe` : "TheMealDB",
              image: meal.strMealThumb,
              yield: "4 servings",
              time: "30-45 mins",
              ingredients: ingredients,
              instructions: steps,
              isDirectData: true
            });
          });
        }
      } catch (e) {
        console.warn("MealDB API query failed:", e);
      }

      if (results.length > 0) {
        renderSearchResults(results, query);
      } else {
        showError(`No recipes found matching "${query}". Try searching for another term or paste a direct website URL.`);
      }
    }

    function renderSearchResults(results, query) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('results-title').innerText = `Results for "${query}"`;
      const grid = document.getElementById('results-grid');
      grid.innerHTML = '';

      results.forEach((res, index) => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition cursor-pointer flex flex-col justify-between";
        
        card.onclick = () => {
          if (res.isDirectData) {
            currentRecipeData = res;
            renderRecipe(res);
          } else {
            fetchAndRenderRecipe(res.url);
          }
        };

        card.innerHTML = `
          <div>
            <div class="h-44 w-full bg-slate-100 overflow-hidden">
              <img src="${res.image || 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&w=800&q=80'}" class="w-full h-full object-cover" alt="${res.title}">
            </div>
            <div class="p-4">
              <span class="text-xs font-bold text-emerald-600 uppercase tracking-wider">${res.source}</span>
              <h3 class="text-base font-bold text-slate-800 mt-1 mb-2 line-clamp-2">${res.title}</h3>
            </div>
          </div>
          <div class="p-4 pt-0">
            <button class="w-full bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-semibold py-2 rounded-lg text-xs transition">
              View Clean Recipe <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('results-view').classList.remove('hidden');
    }

    // CORS Proxy Fetcher with Fallbacks
    async function fetchWithProxy(targetUrl) {
      const proxies = [
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
      ];

      for (const proxy of proxies) {
        try {
          const res = await fetch(proxy);
          if (res.ok) return await res.text();
        } catch (e) {
          console.warn("Proxy failed, trying next...", proxy);
        }
      }
      throw new Error("All CORS proxies failed.");
    }

    // Scrape JSON-LD Schema from any pasted direct URL
    async function fetchAndRenderRecipe(url) {
      showLoading("Scraping and converting recipe...");
      try {
        const html = await fetchWithProxy(url);
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        const jsonLdScripts = doc.querySelectorAll('script[type="application/ld+json"]');
        let recipeData = null;

        jsonLdScripts.forEach(script => {
          try {
            const data = JSON.parse(script.innerText);
            const items = Array.isArray(data) ? data : (data['@graph'] || [data]);
            const found = items.find(item => item['@type'] === 'Recipe' || (Array.isArray(item['@type']) && item['@type'].includes('Recipe')));
            if (found) recipeData = found;
          } catch(e){}
        });

        if (!recipeData) {
          showError("Could not extract standard recipe schema from this link. Try pasting a URL from BBC Good Food, Serious Eats, or Allrecipes.");
          return;
        }

        const parsed = {
          title: recipeData.name || "Untitled Recipe",
          image: extractImage(recipeData.image),
          source: new URL(url).hostname.replace('www.', ''),
          yield: recipeData.recipeYield ? (Array.isArray(recipeData.recipeYield) ? recipeData.recipeYield[0] : recipeData.recipeYield) : "N/A",
          time: recipeData.totalTime ? parseISO8601Duration(recipeData.totalTime) : "N/A",
          ingredients: recipeData.recipeIngredient || [],
          instructions: parseInstructions(recipeData.recipeInstructions)
        };

        currentRecipeData = parsed;
        renderRecipe(parsed);

      } catch (err) {
        console.error(err);
        showError("Failed to fetch recipe page. Please verify the URL and try again.");
      }
    }

    function extractImage(imgField) {
      if (!imgField) return "https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&w=800&q=80";
      if (typeof imgField === 'string') return imgField;
      if (Array.isArray(imgField)) return imgField[0].url || imgField[0];
      if (imgField.url) return imgField.url;
      return "https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&w=800&q=80";
    }

    function parseISO8601Duration(duration) {
      const match = duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?/);
      if (!match) return duration;
      const hours = match[1] ? `${match[1]}h ` : '';
      const mins = match[2] ? `${match[2]}m` : '';
      return hours + mins || duration;
    }

    function parseInstructions(instructions) {
      if (!instructions) return [];
      if (typeof instructions === 'string') return [instructions];
      
      let list = [];
      instructions.forEach(step => {
        if (typeof step === 'string') list.push(step);
        else if (step['@type'] === 'HowToStep') list.push(step.text);
        else if (step['@type'] === 'HowToSection' && step.itemListElement) {
          step.itemListElement.forEach(s => list.push(s.text || s));
        }
      });
      return list;
    }

    function renderRecipe(data) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('recipe-img').src = data.image;
      document.getElementById('recipe-source').innerText = data.source;
      document.getElementById('recipe-title').innerText = data.title;
      document.getElementById('recipe-yield').querySelector('span').innerText = data.yield;
      document.getElementById('recipe-time').querySelector('span').innerText = data.time;

      renderIngredients(data.ingredients);

      const instructionsOl = document.getElementById('instructions-list');
      instructionsOl.innerHTML = '';
      data.instructions.forEach((step, idx) => {
        const li = document.createElement('li');
        li.className = "flex items-start space-x-4";
        li.innerHTML = `
          <input type="checkbox" id="step-${idx}" class="checkbox-custom mt-1 h-5 w-5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
          <label for="step-${idx}" class="text-slate-700 leading-relaxed cursor-pointer select-none">${convertIngredientToMetric(step)}</label>
        `;
        instructionsOl.appendChild(li);
      });

      document.getElementById('recipe-view').classList.remove('hidden');
    }

    function renderIngredients(ingredients) {
      const ingredientsUl = document.getElementById('ingredients-list');
      ingredientsUl.innerHTML = '';
      ingredients.forEach(ing => {
        const converted = convertIngredientToMetric(ing);
        const li = document.createElement('li');
        li.className = "text-slate-700 text-sm flex items-start space-x-2";
        li.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-500 mt-1 text-xs"></i> <span>${converted}</span>`;
        ingredientsUl.appendChild(li);
      });
    }

    // Initialize
    renderSitesPills();
    renderModalSitesList();
  </script>
</body>
</html>
